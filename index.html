<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Terra Classic</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#gameCanvas {
  display: none;
  margin: auto;
  background: #FFD700;
  image-rendering: pixelated;
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  color: black;
  font-weight: bold;
  z-index: 10;
  display: none;
}

button {
  padding: 10px;
  margin: 5px;
  border: none;
  background: #003366;
  color: white;
  border-radius: 5px;
  cursor: pointer;
  width: 230px;
}

#menuBox, #connectChoice {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: #FFD700;
  padding: 30px;
  border-radius: 10px;
  text-align: center;
}

#leaderboardBox {
  display:none;
  text-align:center;
  margin-top:50px;
  color:white;
}
</style>
</head>
<body>

<div id="ui">
  <div id="walletStatus"></div>
  <button onclick="disconnectWallet()">Disconnect</button>
  <div>Score: <span id="score">0</span></div>
  <div>Highscore: <span id="highscore">0</span></div>
</div>

<div id="menuBox">
  <h2>Main Menu</h2>
  <button onclick="connectDesktop()">Play Game</button>
  <button onclick="showLeaderboard()">Leaderboard</button>
</div>

<div id="leaderboardBox"></div>

<div id="connectChoice" style="display:none;">
  <h3>Choose Wallet</h3>
  <button onclick="connectDesktop()">🖥 Connect Desktop</button><br>
  <button onclick="backToMenu()">Back</button>
</div>

<canvas id="gameCanvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>

<script>

// ===== SUPABASE =====
const supabaseUrl = "https://ejcyqjnovijfqqxiutvb.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqY3lxam5vdmlqZnFxeGl1dHZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3MzQzNjMsImV4cCI6MjA4NzMxMDM2M30.kyVO2g-1XaY8ePMG4B6eYowH3jFGtUfLv-ar7Duhk9U";

const { createClient } = supabase;
const supabaseClient = createClient(supabaseUrl, supabaseKey);

// ===== CANVAS =====
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// ===== LOAD 2 FRAME IMAGES =====
const birdFrame1 = new Image();
birdFrame1.src = "terra1.png";

const birdFrame2 = new Image();
birdFrame2.src = "terra2.png";

let currentFrame=0;
let frameTimer=0;
const frameInterval=0.12;

// ===== AUDIO =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playJumpSound(){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type="square";
  osc.frequency.setValueAtTime(700,audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(300,audioCtx.currentTime+0.1);
  gain.gain.setValueAtTime(0.15,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime+0.1);
}

function playCrashSound(){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type="square";
  osc.frequency.setValueAtTime(120,audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40,audioCtx.currentTime+0.3);
  gain.gain.setValueAtTime(0.2,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime+0.3);
}

// ===== STATE =====
let connectedWallet=null;
let gameRunning=false;

let birdY=200;
let velocity=0;
let gravity=1200;
let jumpForce=-450;

let pipes=[];
let pipeTimer=0;
let pipeInterval=2;

let score=0;
let highscore=0;

let lastTime=0;
let gameOver=false;
let flashAlpha=0;

const birdSize=70;
const pipeWidth=70;
const pipeGap=200;
const pipeSpeed=200;

function formatWallet(addr){
  return addr.slice(0,6)+"..."+addr.slice(-4);
}

// ===== CONNECT =====
async function connectDesktop(){
  if(!window.keplr){
    alert("Keplr not detected");
    return;
  }

  await window.keplr.enable("columbus-5");
  const signer = window.getOfflineSigner("columbus-5");
  const accounts = await signer.getAccounts();

  connectedWallet=accounts[0].address;

  await loadHighscoreFromDB();
  startGame();
}

// ===== LOAD HIGHSCORE =====
async function loadHighscoreFromDB(){
  const { data } = await supabaseClient
    .from("leaderboard")
    .select("highscore")
    .eq("wallet",connectedWallet)
    .single();

  highscore = data ? data.highscore : 0;
  document.getElementById("highscore").innerText=highscore;
}

// ===== SAVE SCORE (ONLY IF HIGHER) =====
async function saveScoreToDB(){

  if(score <= highscore) return;

  highscore = score;
  document.getElementById("highscore").innerText=highscore;

  await supabaseClient
    .from("leaderboard")
    .upsert({
      wallet: connectedWallet,
      highscore: highscore
    }, { onConflict: "wallet" });
}

// ===== LEADERBOARD =====
async function showLeaderboard(){

  const { data } = await supabaseClient
    .from("leaderboard")
    .select("*")
    .order("highscore",{ascending:false})
    .limit(10);

  let html="<h2 style='color:white;'>Top 10 Leaderboard</h2>";

  data.forEach((row,i)=>{
    html+=`<p style="color:white;">${i+1}. ${formatWallet(row.wallet)} - ${row.highscore}</p>`;
  });

  html+="<br><button onclick='closeLeaderboard()'>Back</button>";

  document.getElementById("leaderboardBox").innerHTML=html;
  document.getElementById("leaderboardBox").style.display="block";
  document.getElementById("menuBox").style.display="none";
}

function closeLeaderboard(){
  document.getElementById("leaderboardBox").style.display="none";
  document.getElementById("menuBox").style.display="block";
}

// ===== START GAME =====
function startGame(){
  document.getElementById("connectChoice").style.display="none";
  document.getElementById("ui").style.display="block";
  canvas.style.display="block";
  document.getElementById("walletStatus").innerText="Wallet: "+formatWallet(connectedWallet);
  gameRunning=true;
}

// ===== INPUT =====
function jump(){
  if(!gameRunning)return;

  if(gameOver){
    resetGame();
    return;
  }

  velocity=jumpForce;
  playJumpSound();
}
window.addEventListener("keydown",e=>{if(e.code==="Space")jump();});
window.addEventListener("touchstart",jump);

// ===== PIPE =====
function createPipe(){
  const top=Math.random()*(canvas.height-pipeGap-100)+50;
  pipes.push({x:canvas.width,top:top,bottom:top+pipeGap,passed:false});
}

// ===== LOOP =====
function gameLoop(timestamp){

  if(!lastTime)lastTime=timestamp;
  let delta=(timestamp-lastTime)/1000;
  lastTime=timestamp;

  if(gameRunning){

    ctx.fillStyle="#FFD700";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    if(!gameOver){

      velocity+=gravity*delta;
      birdY+=velocity*delta;

      pipeTimer+=delta;
      if(pipeTimer>pipeInterval){
        createPipe();
        pipeTimer=0;
      }

      ctx.fillStyle="#003366";
      for(let i=pipes.length-1;i>=0;i--){
        let pipe=pipes[i];
        pipe.x-=pipeSpeed*delta;

        ctx.fillRect(pipe.x,0,pipeWidth,pipe.top);
        ctx.fillRect(pipe.x,pipe.bottom,pipeWidth,canvas.height);

        if(
          100<pipe.x+pipeWidth &&
          100+birdSize>pipe.x &&
          (birdY<pipe.top || birdY+birdSize>pipe.bottom)
        ){
          gameOver=true;
          flashAlpha=0.6;
          playCrashSound();
          saveScoreToDB();
        }

        if(!pipe.passed && pipe.x<100){
          pipe.passed=true;
          score++;
          document.getElementById("score").innerText=score;
        }

        if(pipe.x<-pipeWidth){pipes.splice(i,1);}
      }
    }

    // FRAME ANIMATION
    frameTimer+=delta;
    if(frameTimer>frameInterval){
      currentFrame=currentFrame===0?1:0;
      frameTimer=0;
    }

    const birdImage=currentFrame===0?birdFrame1:birdFrame2;
    ctx.drawImage(birdImage,100,birdY,birdSize,birdSize);

    // FLASH
    if(flashAlpha>0){
      ctx.fillStyle="rgba(255,0,0,"+flashAlpha+")";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      flashAlpha-=delta;
    }

    if(gameOver){
      ctx.fillStyle="black";
      ctx.fillText("GAME OVER",canvas.width/2-90,canvas.height/2);
    }
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

function resetGame(){
  score=0;
  document.getElementById("score").innerText=0;
  pipes=[];
  velocity=0;
  birdY=200;
  pipeTimer=0;
  gameOver=false;
  flashAlpha=0;
}

function disconnectWallet(){
  connectedWallet=null;
  gameRunning=false;
  document.getElementById("ui").style.display="none";
  canvas.style.display="none";
  document.getElementById("menuBox").style.display="block";
}
</script>

</body>
</html>
